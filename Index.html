<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de Acesso</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        color: rgba(0, 0, 0, 0.6);
        margin-bottom: 40px;
      }

      form {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      div {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2c3e50;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }

      input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
      }

      small {
        display: block;
        color: #e74c3c;
        margin-top: 5px;
        font-size: 14px;
        height: 20px;
      }

      button {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #2980b9;
      }

      .error {
        border-color: #e74c3c;
      }

      .success {
        border-color: #2ecc71;
      }
    </style>
  </head>

  <body>
    <h1>Acesso ao Portal</h1>
    <form id="loginForm" autocomplete="off">
      <div>
        <label for="email">E-mail: </label>
        <input type="email" id="email" placeholder="Digite o seu e-mail" />
        <small id="textEmail"></small>
      </div>
      <div>
        <label for="password">Senha:</label>
        <input
          type="password"
          required
          id="password"
          placeholder="Digite a sua senha"
        />
        <small id="textPassword"></small>
      </div>
      <button type="submit">Entrar</button>
    </form>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const textEmail = document.getElementById("textEmail");
        const textPassword = document.getElementById("textPassword");

        function isValidEmail(email) {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          return emailRegex.test(email);
        }
        email.addEventListener("input", function () {
          if (email.value.trim() === "") {
            textEmail.textContent = "O campo e-mail é obrigatório";
            email.className = "error";
          } else if (!isValidEmail(email.value)) {
            textEmail.textContent = "Por favor, insira um e-mail válido";
            email.className = "error";
          } else {
            textEmail.textContent = "";
            email.className = "success";
          }
        });

        password.addEventListener("input", function () {
          if (password.value.trim() === "") {
            textPassword.textContent = "O campo senha é obrigatório";
            password.className = "error";
          } else if (password.value.length < 6) {
            textPassword.textContent =
              "A senha deve ter pelo menos 6 caracteres";
            password.className = "error";
          } else {
            textPassword.textContent = "";
            password.className = "success";
          }
        });

        form.addEventListener("submit", function (event) {
          event.preventDefault();

          let isValid = true;

          if (email.value.trim() === "") {
            textEmail.textContent = "O campo e-mail é obrigatório";
            email.className = "error";
            isValid = false;
          } else if (!isValidEmail(email.value)) {
            textEmail.textContent = "Por favor, insira um e-mail válido";
            email.className = "error";
            isValid = false;
          }
          if (password.value.trim() === "") {
            textPassword.textContent = "O campo senha é obrigatório";
            password.className = "error";
            isValid = false;
          } else if (password.value.length < 6) {
            textPassword.textContent =
              "A senha deve ter pelo menos 6 caracteres";
            password.className = "error";
            isValid = false;
          }
          if (isValid) {
            alert("Login bem-sucedido!");
          }
        });
      });
    </script>
  </body>
</html>
